name: release
# Run it from the Actions page ("Run workflow" on main, with the version) to
# tag the head of main and make its GitHub release. Packagist follows the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release from the head of main, such as v0.2.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run it on main, not $GITHUB_REF" >&2
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Not a version: $TAG (want v1.2.3 or v1.2.3-rc.1)" >&2
            exit 1
          fi
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes $prerelease
